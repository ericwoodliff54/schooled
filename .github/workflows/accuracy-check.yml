name: Photo test set check

# Run it by hand: Actions tab, "Photo test set check", Run workflow.
# Sends every photo in the private test-set repo through the Worker's Fish Check and scores it against labels.csv.
# The photos are not stored in this (public) repo. Each variant costs a few cents for the 73 photos; the default runs five variants side by side.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'What to run, comma separated. app = exactly what the app does. Or model[+solo][+ground][+res=medium][+think=minimal], e.g. gemini-4-hydrogen+solo+think=minimal'
        default: 'app,gemini-3.6-flash+solo,gemini-3.6-flash+solo+res=medium,gemini-3.6-flash+solo+think=minimal,gemini-4-hydrogen+solo,gemini-4-hydrogen+solo+think=minimal'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ericwoodliff54/schooled-testset
          token: ${{ secrets.TESTSET_TOKEN }}
          path: testset
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run the photo check
        env:
          TEST_KEY: ${{ secrets.TEST_KEY }}
        run: python photo_check.py --dir testset --variants "${{ inputs.variants }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-report
          path: photo-out/
          retention-days: 30

