name: Accuracy check

# Run it by hand: Actions tab, "Accuracy check", Run workflow.
# Pulls labeled photos from Wikimedia Commons, sends them to the Worker, and writes a report.
# Rough cost: about 0.15 cents per photo (default run is under 10 cents).

on:
  workflow_dispatch:
    inputs:
      species:
        description: 'How many species to test'
        default: '25'
      photos:
        description: 'Photos per species (1 to 6)'
        default: '2'
      kinds:
        description: 'Only these kinds, comma separated (fish, coral, plant, shrimp, snail). Blank = all'
        default: ''
      names:
        description: 'Or test exactly these species, comma separated'
        default: ''
      seed:
        description: 'Same number = same species and photos'
        default: '7'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run the check
        env:
          TEST_KEY: ${{ secrets.TEST_KEY }}
        run: |
          python accuracy_check.py \
            --limit "${{ inputs.species }}" \
            --per "${{ inputs.photos }}" \
            --kinds "${{ inputs.kinds }}" \
            --names "${{ inputs.names }}" \
            --seed "${{ inputs.seed }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-report
          path: accuracy-out/
          retention-days: 30
