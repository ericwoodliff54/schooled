name: Android release bundle (for Google Play)

# Builds the signed .aab file you upload to Google Play. Run it from the Actions tab.
# Repository secrets needed:
#   RC_ANDROID_KEY              RevenueCat public SDK key for Android (starts with goog_)
#   ANDROID_KEYSTORE_B64        your upload keystore file, as base64 text
#   ANDROID_KEYSTORE_PASSWORD   the keystore password
#   ANDROID_KEY_ALIAS           the key alias (upload)
#   ANDROID_KEY_PASSWORD        the key password
# Each run gets a higher version number automatically (Google Play requires that).
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses (the Android tools are already installed on GitHub's machines)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install packages
        run: npm ci --no-audit --no-fund
      - name: Build the web files for the app
        env:
          REQUIRE_RC_KEY: RC_ANDROID_KEY
          RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
          RC_IOS_KEY: ${{ secrets.RC_IOS_KEY }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
          TERMS_URL: ${{ vars.TERMS_URL }}
        run: node build-www.js
      - name: Create and sync the Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Make the app icons from the Schooled logo
        run: |
          mkdir -p assets
          if command -v magick >/dev/null 2>&1; then IM=magick; elif command -v convert >/dev/null 2>&1; then IM=convert; else
            (sudo apt-get update && sudo apt-get install -y imagemagick) || brew install imagemagick
            IM=$(command -v magick || command -v convert)
          fi
          $IM icon-maskable.png -filter Lanczos -resize 1024x1024 assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          $IM -size 1024x1024 xc:white assets/icon-background.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff'
      - name: Save the signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Set version, permissions and signing
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: node patch-native.js
      - name: Build the signed bundle
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export GRADLE_OPTS="-Dorg.gradle.internal.repository.max.retries=8 -Dorg.gradle.internal.repository.initial.backoff=3000"
          for i in 1 2 3; do
            ./gradlew bundleRelease --no-daemon && exit 0
            echo "Attempt $i failed (Maven Central sometimes rate-limits GitHub). Waiting 60 seconds."
            sleep 60
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: schooled-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

