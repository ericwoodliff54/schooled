yaml
name: Tank scan check

# Run it by hand: Actions tab, "Tank scan check", Run workflow.
# Builds test tanks by tiling known photos from Wikimedia Commons, runs the tank scan on each, and reports
# which species it found, missed or invented. About 0.55 cents per tank, so the default run is a few cents.

on:
  workflow_dispatch:
    inputs:
      tanks:
        description: 'How many test tanks to build'
        default: '10'
      per:
        description: 'Species per tank (2 to 6)'
        default: '4'
      seed:
        description: 'Same number = same tanks, so you can compare before and after a change'
        default: '7'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Run the scan check
        env:
          TEST_KEY: ${{ secrets.TEST_KEY }}
        run: |
          python scan_check.py \
            --tanks "${{ inputs.tanks }}" \
            --per "${{ inputs.per }}" \
            --seed "${{ inputs.seed }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-report
          path: scan-out/
          retention-days: 30

Save it in your repo as .github/workflows/scan-check.yml. Use the copy button in the corner of the code block so the indentation stays intact. You also need scan_check.py in the repo root, from update50.zip.

