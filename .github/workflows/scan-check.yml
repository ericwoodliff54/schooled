Yes, tank scans can be tested too, with one limit. I sent the tank scan test as update50.zip, and the new database batch as update51.zip.

Tank scan check (update50.zip)

How it works: it builds a test tank by tiling four known photos from Wikimedia Commons into one picture. It sends that picture through the app's real tank scan and checks which species came back. You get a report with:
how many species were found
how many answers were really in the tank
whether the counts were right
which species it missed most
which names it invented
The limit: these are tiled photos, not real tank photos. It tests naming and counting several species at once, but not reflections, overlapping fish or messy backgrounds. Photos of your own tanks are the only test for those, so a few real scans on your phone are still worth doing.
Cost and setup: it costs about 0.55 cents per tank, so the default 10 tanks is a few cents. Add scan_check.py to the repo root, and create .github/workflows/scan-check.yml from the file, using the same steps as the first workflow. Run it from the Actions tab, under "Tank scan check". It uses the same TEST_KEY secret.
Testing: I tested the script here against stand-in servers. It has not run against the real Worker.

