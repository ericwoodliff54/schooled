name: Android test build

# Builds a test APK you can install on an Android phone. It does not publish anything.
# Add these repository secrets first (Settings > Secrets and variables > Actions):
#   RC_ANDROID_KEY   RevenueCat public SDK key for Android (starts with goog_)
#   RC_IOS_KEY       RevenueCat public SDK key for iPhone (starts with appl_), only needed once the iPhone app exists
# Optional repository variables: PRIVACY_URL, TERMS_URL.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses (the Android tools are already installed on GitHub's machines)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Build the web files for the app
        env:
          RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
          RC_IOS_KEY: ${{ secrets.RC_IOS_KEY }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
          TERMS_URL: ${{ vars.TERMS_URL }}
        run: node build-www.js
      - name: Create and sync the Android project
        run: |
          npx cap add android
          npx cap sync android
          node patch-native.js
      - name: Make the app icons from the Schooled logo
        run: |
          mkdir -p assets
          convert icon-maskable.png -filter Lanczos -resize 1024x1024 assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          convert -size 1024x1024 xc:white assets/icon-background.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff'
      - name: Build the test APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: schooled-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

