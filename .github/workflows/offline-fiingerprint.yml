name: Offline ID fingerprints

on:
  workflow_dispatch:
    inputs:
      species:
        description: 'How many species (0 = all; try 40 first as a quick test)'
        default: '40'
      photos:
        description: 'Photos per species (more = better, slower)'
        default: '30'
      kinds:
        description: 'Only these kinds, comma separated (fish, coral, plant, invert, shrimp, snail). Blank = all'
        default: ''
      water:
        description: 'f = freshwater only, s = saltwater only, blank = both'
        default: ''
      models:
        description: 'Which models to compare (small, large)'
        default: 'small,large'
      seed:
        description: 'Same number = same species picked in a partial run'
        default: '7'

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet timm pillow numpy requests
      - name: Collect photos and make fingerprints
        run: |
          python offline_fingerprints.py \
            --limit "${{ inputs.species }}" \
            --per "${{ inputs.photos }}" \
            --kinds "${{ inputs.kinds }}" \
            --water "${{ inputs.water }}" \
            --models "${{ inputs.models }}" \
            --seed "${{ inputs.seed }}" \
            --max-minutes 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-id-report
          path: offline-out/
          retention-days: 30
